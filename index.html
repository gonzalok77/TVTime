<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <!-- Viewport: sin zoom accidental y ocupando toda la pantalla (muesca incluida) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Seguimiento personal de películas y series" />

  <!-- PWA / iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mis Series" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

  <title>Mis Series</title>

  <!-- Tailwind por CDN (sin compilación) -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: '#0b0b0f',
            card: '#16161c',
            card2: '#1f1f27',
            line: '#2a2a34',
            accent: { DEFAULT: '#f5a524', dark: '#d98a0b' }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', 'Inter', 'Roboto', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            soft: '0 10px 30px -12px rgba(0,0,0,.7)',
            glow: '0 8px 24px -8px rgba(245,165,36,.45)'
          }
        }
      }
    };
  </script>

  <style>
    :root { color-scheme: dark; }
    html, body {
      background: #0b0b0f;
      color: #f1f1f4;
      margin: 0;
      min-height: 100%;
      overscroll-behavior-y: none;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Roboto, system-ui, sans-serif;
    }
    /* Sensación nativa: sin selección de texto en controles y sin retardo táctil */
    button, a, nav, header, .no-select {
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    /* 16px evita que iOS haga zoom al enfocar un campo */
    input, textarea { font-size: 16px !important; -webkit-user-select: text; user-select: text; }

    /* Zonas seguras (muesca y barra inferior) */
    .pt-safe { padding-top: env(safe-area-inset-top); }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .px-safe { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    .main-pad { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
    .page-end { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
    .top-safe { top: calc(env(safe-area-inset-top) + 8px); }
    .toast-pos { bottom: calc(80px + env(safe-area-inset-bottom)); }

    /* Botón icono táctil (44px mínimo) */
    .icon-btn {
      width: 44px; height: 44px; min-width: 44px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 9999px; transition: background-color .15s, transform .15s;
    }
    .icon-btn:active { background: rgba(255,255,255,.08); transform: scale(.94); }
    .press { transition: transform .15s ease, opacity .15s ease; }
    .press:active { transform: scale(.97); opacity: .85; }

    /* Transiciones */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
    @keyframes popIn { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes shake { 0%,100% { transform: none; } 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    .screen-enter { animation: fadeUp .25s ease-out; }
    .overlay-enter { animation: slideIn .28s cubic-bezier(.2,.8,.2,1); }
    .pop-in { animation: popIn .22s ease-out; }
    .shake { animation: shake .4s ease; }

    /* Esqueletos de carga */
    .skeleton {
      background: linear-gradient(90deg, #1b1b22 25%, #272731 37%, #1b1b22 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    .snap-x-row { scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
    .snap-x-row > * { scroll-snap-align: start; }

    /* Pantalla de arranque (antes de que cargue Preact) */
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #8a8a96; font-size: 14px; }
    #boot .dot { width: 10px; height: 10px; border-radius: 50%; background: #f5a524; animation: fadeUp .8s ease-in-out infinite alternate; }
  </style>
</head>
<body>
  <div id="app">
    <div id="boot"><div class="dot"></div><span id="boot-msg">Cargando Mis Series…</span></div>
  </div>

  <!-- Si los módulos del CDN no cargan (p. ej. primera vez sin conexión), avisamos -->
  <script>
    setTimeout(function () {
      if (!window.__misSeriesStarted) {
        var m = document.getElementById('boot-msg');
        if (m) m.innerHTML = 'No se pudo cargar la app.<br>Comprueba tu conexión y <a href="" style="color:#f5a524">vuelve a intentarlo</a>.';
      }
    }, 10000);

    // Registro del service worker: solo si el navegador lo soporta y no es file://
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.24.3';
    import { useState, useEffect, useRef, useLayoutEffect } from 'https://esm.sh/preact@10.24.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';
    import * as Lucide from 'https://esm.sh/lucide@0.460.0';

    const html = htm.bind(h);
    window.__misSeriesStarted = true;

    /* =====================================================================
       UTILIDADES
       ===================================================================== */
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const norm = (s) => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const pad2 = (n) => String(n).padStart(2, '0');
    const toDateStr = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const todayStr = () => toDateStr(new Date());
    const addDaysStr = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return toDateStr(d); };
    // Las fechas de TMDB son "AAAA-MM-DD": las interpretamos en hora local
    const parseDate = (s) => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
    const daysUntil = (s) => { const d = parseDate(s); return d ? Math.round((d - parseDate(todayStr())) / 864e5) : null; };
    const fmtDate = (s, opts = { day: 'numeric', month: 'long', year: 'numeric' }) => {
      const d = parseDate(s); return d ? d.toLocaleDateString('es-ES', opts) : '';
    };
    const yearOf = (s) => (s ? String(s).slice(0, 4) : '');
    const fmtRuntime = (m) => { if (!m) return ''; const hh = Math.floor(m / 60), mm = m % 60; return hh ? `${hh} h${mm ? ` ${mm} min` : ''}` : `${mm} min`; };
    const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
    // Cuenta atrás amable: "hoy", "mañana", "en 3 días"
    function countdown(s) {
      const n = daysUntil(s);
      if (n == null) return '';
      if (n < 0) return 'ya emitido';
      if (n === 0) return 'hoy';
      if (n === 1) return 'mañana';
      if (n <= 30) return `en ${n} días`;
      return fmtDate(s, { day: 'numeric', month: 'short' });
    }
    function timeAgo(ts) {
      const diff = (Date.now() - ts) / 1000;
      if (diff < 60) return 'hace un momento';
      if (diff < 3600) return `hace ${Math.floor(diff / 60)} min`;
      if (diff < 86400) return `hace ${plural(Math.floor(diff / 3600), 'hora', 'horas')}`;
      return `hace ${plural(Math.floor(diff / 86400), 'día', 'días')}`;
    }
    const TV_STATUS = {
      'Returning Series': { label: 'En emisión', cls: 'bg-emerald-500/15 text-emerald-300' },
      'In Production': { label: 'En producción', cls: 'bg-sky-500/15 text-sky-300' },
      'Planned': { label: 'Planificada', cls: 'bg-sky-500/15 text-sky-300' },
      'Pilot': { label: 'Piloto', cls: 'bg-sky-500/15 text-sky-300' },
      'Ended': { label: 'Finalizada', cls: 'bg-zinc-500/20 text-zinc-300' },
      'Canceled': { label: 'Cancelada', cls: 'bg-rose-500/15 text-rose-300' }
    };

    /* Avisos discretos (toasts) */
    let lastToast = { msg: '', t: 0 };
    function toast(msg) {
      const now = Date.now();
      if (msg === lastToast.msg && now - lastToast.t < 4000) return; // evita repetir el mismo aviso
      lastToast = { msg, t: now };
      window.dispatchEvent(new CustomEvent('ms-toast', { detail: msg }));
    }

    /* =====================================================================
       STORAGE (localStorage con try/catch y respaldo en memoria)
       ===================================================================== */
    // Prefijo: en GitHub Pages todos tus repos comparten origen (usuario.github.io)
    const PREFIX = 'misseries:';
    const memory = {};
    let storageWarned = false;

    function load(key, fallback) {
      try {
        const raw = localStorage.getItem(PREFIX + key);
        if (raw != null) return JSON.parse(raw);
      } catch (e) { /* almacenamiento no disponible o JSON corrupto */ }
      return key in memory ? memory[key] : fallback;
    }
    function save(key, value) {
      memory[key] = value; // siempre queda en memoria
      try {
        localStorage.setItem(PREFIX + key, JSON.stringify(value));
        return true;
      } catch (e) {
        if (!storageWarned) { storageWarned = true; toast('No se pudo guardar en el dispositivo. Los cambios se perderán al cerrar.'); }
        return false;
      }
    }
    function removeKey(key) {
      delete memory[key];
      try { localStorage.removeItem(PREFIX + key); } catch (e) {}
    }

    const DEFAULT_SETTINGS = { apiKey: '', pinHash: '', lastCheck: 0, demo: false };
    const PERSISTED = ['titles', 'watchedEpisodes', 'notifications', 'settings'];

    // Almacén global mínimo con suscripción
    const store = {
      state: {
        titles: load('titles', {}),
        watchedEpisodes: load('watchedEpisodes', {}),
        notifications: load('notifications', []),
        settings: { ...DEFAULT_SETTINGS, ...load('settings', {}) },
        checking: false // no se guarda
      },
      listeners: new Set(),
      set(key, valueOrFn) {
        const prev = this.state[key];
        const next = typeof valueOrFn === 'function' ? valueOrFn(prev) : valueOrFn;
        this.state = { ...this.state, [key]: next };
        if (PERSISTED.includes(key)) save(key, next);
        this.listeners.forEach((l) => l());
      }
    };
    function useStore() {
      const [, force] = useState(0);
      useEffect(() => {
        const l = () => force((n) => n + 1);
        store.listeners.add(l);
        return () => store.listeners.delete(l);
      }, []);
      return store.state;
    }

    const keyOf = (type, id) => `${type}_${id}`;
    const isEmptyEntry = (e) => !e.status && !e.followed && !e.rating && !(e.notes || '').trim();

    // Crea o actualiza un título guardado. touch=false para refrescos automáticos (no cambia el orden)
    function upsertTitle(type, id, patch, { touch = true } = {}) {
      store.set('titles', (all) => {
        const k = keyOf(type, id);
        const cur = all[k] || {
          id: Number(id), type, title: '', poster: null, backdrop: null, status: null, rating: 0,
          notes: '', followed: false, knownSeasons: 0, nextEpisode: null, updatedAt: Date.now()
        };
        const next = { ...cur, ...patch };
        if (touch) next.updatedAt = Date.now();
        const copy = { ...all };
        if (isEmptyEntry(next)) delete copy[k]; else copy[k] = next;
        return copy;
      });
    }

    function addNotification(titleId, kind, message) {
      store.set('notifications', (list) => [
        { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), titleId, kind, message, date: new Date().toISOString(), read: false },
        ...list
      ].slice(0, 100));
    }

    // Marca o desmarca episodios: watchedEpisodes[tvId][season] = [números]
    function setEpisodes(tvId, season, eps, on) {
      store.set('watchedEpisodes', (all) => {
        const tv = { ...(all[tvId] || {}) };
        const set = new Set(tv[season] || []);
        eps.forEach((e) => (on ? set.add(e) : set.delete(e)));
        const arr = [...set].sort((a, b) => a - b);
        if (arr.length) tv[season] = arr; else delete tv[season];
        const copy = { ...all };
        if (Object.keys(tv).length) copy[tvId] = tv; else delete copy[tvId];
        return copy;
      });
    }

    // Progreso de una serie: "T2 · 5/10 episodios"
    function seriesProgress(t, w = {}) {
      const seasons = t.seasonsInfo || [];
      const totalEps = seasons.reduce((a, s) => a + (s.eps || 0), 0);
      const watchedTotal = Object.values(w).reduce((a, l) => a + l.length, 0);
      const withEps = Object.keys(w).map(Number).filter((n) => (w[n] || []).length);
      let cur = withEps.length ? Math.max(...withEps) : 1;
      let info = seasons.find((s) => s.n === cur);
      let seen = (w[cur] || []).length;
      // Temporada actual terminada y hay otra después: mostramos la siguiente
      if (info && seen >= info.eps && seasons.find((s) => s.n === cur + 1)) {
        cur += 1; info = seasons.find((s) => s.n === cur); seen = (w[cur] || []).length;
      }
      const label = info ? `T${cur} · ${seen}/${info.eps} episodios` : `T${cur} · ${plural(seen, 'episodio', 'episodios')}`;
      return { label, pct: totalEps ? Math.min(1, watchedTotal / totalEps) : 0, watchedTotal, totalEps };
    }

    /* =====================================================================
       API (TMDB v3) + datos de ejemplo
       ===================================================================== */
    const API = 'https://api.themoviedb.org/3';
    const IMG = 'https://image.tmdb.org/t/p/';
    const img = (path, size = 'w342') => (path ? IMG + size + path : null);
    const DETAIL_PARAMS = { append_to_response: 'watch/providers,recommendations' };
    // Token v4 (JWT, empieza por "eyJ") o API key v3 (32 caracteres)
    const isV4 = (k) => k.startsWith('eyJ') || k.length > 60;

    class ApiError extends Error {
      constructor(status, msg) { super(msg); this.status = status; }
    }

    const memCache = new Map(); // caché en memoria para no repetir peticiones en la misma sesión

    async function tmdb(path, params = {}, { key, cacheMs = 5 * 60e3, force = false } = {}) {
      key = (key ?? store.state.settings.apiKey ?? '').trim();
      if (!key) return mockApi(path, params); // sin clave → datos de ejemplo

      const url = new URL(API + path);
      const all = { language: 'es-ES', region: 'ES', ...params };
      Object.entries(all).forEach(([k, v]) => url.searchParams.set(k, v));
      const headers = { accept: 'application/json' };
      if (isV4(key)) headers.Authorization = 'Bearer ' + key;
      else url.searchParams.set('api_key', key);

      const ck = url.toString();
      const hit = memCache.get(ck);
      if (!force && hit && Date.now() - hit.t < cacheMs) return hit.data;

      let res;
      try { res = await fetch(url, { headers }); }
      catch (e) { throw new ApiError(0, 'Sin conexión'); }
      if (!res.ok) throw new ApiError(res.status, 'Error ' + res.status);
      const data = await res.json();
      memCache.set(ck, { t: Date.now(), data });
      return data;
    }

    function reportError(e) {
      if (e && e.status === 401) toast('La clave de TMDB no es válida. Revísala en Ajustes.');
      else if (e && e.status === 429) toast('Demasiadas peticiones a TMDB. Espera un momento.');
      else if (e && e.status === 404) toast('No se encontró ese título en TMDB.');
      else toast('Sin conexión con TMDB. Mostrando lo que hay guardado.');
    }

    // Hook de carga: { loading, data, error }. Si fn devuelve null no hace nada.
    function useApi(fn, deps) {
      const [st, setSt] = useState({ loading: true, data: null, error: null });
      useEffect(() => {
        let alive = true;
        const p = fn();
        if (!p) { setSt({ loading: false, data: null, error: null }); return; }
        setSt({ loading: true, data: null, error: null });
        p.then((data) => alive && setSt({ loading: false, data, error: null }))
          .catch((e) => { if (!alive) return; reportError(e); setSt({ loading: false, data: null, error: e }); });
        return () => { alive = false; };
      }, deps);
      return st;
    }

    // ---- Datos de ejemplo (títulos ficticios) para probar sin clave ----
    const MOCK_DB = [
      { media_type: 'tv', id: 900001, name: 'El Faro del Norte', first_air_date: '2023-02-10', vote_average: 8.2, genres: ['Drama', 'Misterio'], seasons: [8, 8, 6], status: 'Returning Series', nextIn: 3, providers: ['Netflix'], overview: 'Una farera descubre que las señales luminosas de su isla esconden mensajes enviados desde otra época.' },
      { media_type: 'tv', id: 900003, name: 'Los Jardines de Marte', first_air_date: '2024-10-01', vote_average: 7.6, genres: ['Ciencia ficción'], seasons: [6, 8], status: 'Returning Series', nextIn: 0, providers: ['Max'], overview: 'Los primeros colonos de Marte intentan cultivar un jardín mientras la Tierra deja de responder.' },
      { media_type: 'tv', id: 900002, name: 'Código Medianoche', first_air_date: '2021-09-01', vote_average: 7.9, genres: ['Crimen', 'Suspense'], seasons: [10, 10], status: 'Ended', providers: ['Prime Video'], overview: 'Una unidad de delitos informáticos persigue a un hacker que solo actúa a las doce en punto.' },
      { media_type: 'tv', id: 900004, name: 'Turno de Noche', first_air_date: '2019-01-15', vote_average: 7.1, genres: ['Comedia'], seasons: [12, 12, 10], status: 'Canceled', providers: [], overview: 'Las desventuras del personal de un hotel de carretera que nunca cierra.' },
      { media_type: 'movie', id: 800001, title: 'Ciudad de Neón', release_date: '2024-05-03', vote_average: 7.4, runtime: 118, genres: ['Ciencia ficción', 'Acción'], providers: ['Disney+'], overview: 'En una metrópolis donde la luz nunca se apaga, una mensajera descubre una conspiración.' },
      { media_type: 'movie', id: 800002, title: 'La Última Receta', release_date: '2023-11-17', vote_average: 6.9, runtime: 104, genres: ['Comedia', 'Drama'], providers: ['Filmin'], overview: 'Un chef retirado vuelve a la cocina para reconstruir el libro de recetas de su abuela.' },
      { media_type: 'movie', id: 800003, title: 'Tormenta de Arena', release_date: addDaysStr(12), vote_average: 0, runtime: 131, genres: ['Aventura'], providers: [], overview: 'Una expedición cruza el desierto en busca de una ciudad que aparece y desaparece.' },
      { media_type: 'movie', id: 800004, title: 'El Archivo Perdido', release_date: addDaysStr(26), vote_average: 0, runtime: 97, genres: ['Suspense'], providers: [], overview: 'Una archivera encuentra una caja que nadie debería haber abierto.' }
    ];
    const mockResult = (m) => ({
      id: m.id, media_type: m.media_type, title: m.title, name: m.name, poster_path: null, backdrop_path: null,
      release_date: m.release_date, first_air_date: m.first_air_date, vote_average: m.vote_average, overview: m.overview
    });
    function mockDetail(m) {
      const base = {
        ...mockResult(m),
        genres: m.genres.map((name, i) => ({ id: i, name })),
        'watch/providers': { results: { ES: { flatrate: m.providers.map((p, i) => ({ provider_id: i, provider_name: p, logo_path: null })) } } },
        recommendations: { results: MOCK_DB.filter((x) => x.id !== m.id).slice(0, 5).map(mockResult) }
      };
      if (m.media_type === 'movie') return { ...base, runtime: m.runtime };
      const last = m.seasons.length;
      const nextEp = m.nextIn != null ? Math.ceil(m.seasons[last - 1] / 2) : null;
      return {
        ...base,
        status: m.status,
        number_of_seasons: last,
        seasons: m.seasons.map((c, i) => ({ season_number: i + 1, episode_count: c, name: `Temporada ${i + 1}` })),
        next_episode_to_air: nextEp ? { season_number: last, episode_number: nextEp, name: `Capítulo ${nextEp}`, air_date: addDaysStr(m.nextIn) } : null,
        last_episode_to_air: { season_number: last, episode_number: nextEp ? nextEp - 1 : m.seasons[last - 1], name: 'Capítulo anterior', air_date: addDaysStr((m.nextIn ?? -300) - 7) }
      };
    }
    function mockSeason(m, n) {
      const count = m.seasons[n - 1] || 0;
      const isLast = n === m.seasons.length;
      const nextEp = isLast && m.nextIn != null ? Math.ceil(count / 2) : null;
      return {
        season_number: n,
        episodes: Array.from({ length: count }, (_, i) => {
          const e = i + 1;
          const date = nextEp ? addDaysStr(m.nextIn + (e - nextEp) * 7) : addDaysStr(-400 * (m.seasons.length - n + 1) + e * 7);
          return { episode_number: e, name: `Capítulo ${e}`, air_date: date, runtime: 45 };
        })
      };
    }
    async function mockApi(path, params) {
      await sleep(350); // simula la red para ver los esqueletos
      let m;
      if (path === '/authentication') return { success: true };
      if (path === '/trending/all/week') return { results: MOCK_DB.filter((x) => !(x.release_date && daysUntil(x.release_date) > 0)).map(mockResult) };
      if (path === '/movie/upcoming') return { results: MOCK_DB.filter((x) => x.media_type === 'movie' && daysUntil(x.release_date) > 0).map(mockResult) };
      if (path === '/search/multi') {
        const q = norm(params.query);
        return { results: MOCK_DB.filter((x) => norm(x.title || x.name).includes(q)).map(mockResult) };
      }
      if ((m = path.match(/^\/tv\/(\d+)\/season\/(\d+)$/))) {
        const it = MOCK_DB.find((x) => x.media_type === 'tv' && x.id === +m[1]);
        if (it) return mockSeason(it, +m[2]);
      }
      if ((m = path.match(/^\/(movie|tv)\/(\d+)$/))) {
        const it = MOCK_DB.find((x) => x.media_type === m[1] && x.id === +m[2]);
        if (it) return mockDetail(it);
      }
      throw new ApiError(404, 'No encontrado');
    }

    // Datos básicos que guardamos de cada título a partir de la respuesta de TMDB
    const pickEp = (e) => (e ? { season: e.season_number, episode: e.episode_number, name: e.name || '', date: e.air_date || '' } : null);
    function baseInfo(type, d) {
      const info = {
        title: d.title || d.name || 'Sin título',
        poster: d.poster_path || null,
        backdrop: d.backdrop_path || null,
        year: yearOf(d.release_date || d.first_air_date)
      };
      if (type === 'tv') {
        info.tvStatus = d.status || '';
        info.seasonsInfo = (d.seasons || []).filter((s) => s.season_number > 0).map((s) => ({ n: s.season_number, eps: s.episode_count || 0 }));
        info.nextEpisode = pickEp(d.next_episode_to_air);
      } else {
        info.runtime = d.runtime || 0;
      }
      return info;
    }

    /* =====================================================================
       AVISOS DE ESTRENOS (comprobación de series seguidas)
       ===================================================================== */
    const SIX_HOURS = 6 * 3600e3;
    const sameEp = (a, b) => a && b && a.season === b.season && a.episode === b.episode && a.date === b.date;

    // Compara la respuesta fresca de /tv/{id} con lo guardado y genera avisos
    function applySeriesUpdate(id, d, { notify = true } = {}) {
      const k = keyOf('tv', id);
      const saved = store.state.titles[k];
      if (!saved) return;
      const info = baseInfo('tv', d);
      const seasons = d.number_of_seasons || 0;
      const patch = { ...info };
      const canNotify = notify && saved.followed;

      if (seasons > (saved.knownSeasons || 0)) {
        if (saved.knownSeasons) {
          patch.newSeason = true;
          if (canNotify) addNotification(k, 'season', `¡Nueva temporada de «${info.title}»! Ya está anunciada la temporada ${seasons}.`);
        }
        patch.knownSeasons = seasons;
      }
      const next = info.nextEpisode;
      if (canNotify && next && next.date && !sameEp(next, saved.nextEpisode) && daysUntil(next.date) >= 0) {
        addNotification(k, 'episode',
          `Nuevo episodio de «${info.title}»: T${next.season}·E${next.episode}${next.name ? ` «${next.name}»` : ''}, ${fmtDate(next.date, { weekday: 'long', day: 'numeric', month: 'long' })}.`);
      }
      upsertTitle('tv', id, patch, { touch: false });
    }

    // Como máximo una vez cada 6 horas (o forzada desde Ajustes / Inicio)
    async function checkFollowedSeries({ force = false } = {}) {
      const s = store.state.settings;
      if (store.state.checking) return;
      if (!force && Date.now() - (s.lastCheck || 0) < SIX_HOURS) return;
      const followed = Object.values(store.state.titles).filter((t) => t.type === 'tv' && t.followed);
      store.set('checking', true);
      let ok = 0, failed = 0;
      try {
        for (let i = 0; i < followed.length; i++) {
          if (i) await sleep(400); // escalonado: ~2,5 peticiones/s, muy por debajo del límite de TMDB
          try {
            const d = await tmdb(`/tv/${followed[i].id}`, {}, { force: true });
            applySeriesUpdate(followed[i].id, d);
            ok++;
          } catch (e) {
            failed++;
            if (e.status === 0 || e.status === 401) break; // sin red o clave mala: no seguimos
          }
        }
        if (ok || !followed.length) store.set('settings', (st) => ({ ...st, lastCheck: Date.now() }));
        if (failed && force) toast('No se pudieron comprobar todas las series.');
      } finally {
        store.set('checking', false);
      }
    }

    /* =====================================================================
       PIN (SHA-256 con Web Crypto)
       ===================================================================== */
    const cryptoOk = !!(window.crypto && crypto.subtle);
    async function sha256Pin(pin) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('misseries-pin:' + pin));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
    }

    /* =====================================================================
       ROUTER (rutas por hash + historial del navegador)
       ===================================================================== */
    // history.state.d = profundidad dentro de la app, para saber si "atrás" sale de ella
    function parseRoute() {
      const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
      return { name: parts[0] || 'inicio', params: parts.slice(1) };
    }
    function navigate(path, { replace = false } = {}) {
      const depth = (history.state && history.state.d) || 0;
      if (replace) history.replaceState({ d: depth }, '', '#' + path);
      else history.pushState({ d: depth + 1 }, '', '#' + path);
      window.dispatchEvent(new Event('ms-route'));
    }
    function goBack(fallback = '/inicio') {
      if (((history.state && history.state.d) || 0) > 0) history.back(); // también lo hace el gesto/botón atrás
      else navigate(fallback, { replace: true });
    }
    const openTitle = (type, id) => navigate(`/${type === 'tv' ? 'serie' : 'pelicula'}/${id}`);
    function useRoute() {
      const [r, setR] = useState(parseRoute);
      useEffect(() => {
        const on = () => setR(parseRoute());
        ['popstate', 'hashchange', 'ms-route'].forEach((ev) => window.addEventListener(ev, on));
        return () => ['popstate', 'hashchange', 'ms-route'].forEach((ev) => window.removeEventListener(ev, on));
      }, []);
      return r;
    }

    /* =====================================================================
       COMPONENTES
       ===================================================================== */
    // Icono de lucide renderizado como SVG de Preact
    function Icon({ name, size = 20, class: cls = '', fill = 'none', strokeWidth = 2 }) {
      const node = Lucide[name];
      if (!node) return null;
      const children = node[0] === 'svg' ? node[2] : node;
      return h('svg', {
        xmlns: 'http://www.w3.org/2000/svg', width: size, height: size, viewBox: '0 0 24 24', fill,
        stroke: 'currentColor', 'stroke-width': strokeWidth, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
        class: cls, 'aria-hidden': 'true'
      }, children.map(([tag, attrs], i) => h(tag, { ...attrs, key: i })));
    }

    // Póster con marcador de posición si no hay imagen
    function Poster({ path, title = '', id = 0, size = 'w342', class: cls = '' }) {
      const [err, setErr] = useState(false);
      if (!path || err) {
        const hue = (Number(id) * 47 || title.length * 37) % 360;
        return html`<div class=${'flex flex-col items-center justify-center text-center p-2 overflow-hidden ' + cls}
          style=${{ background: `linear-gradient(160deg, hsl(${hue} 35% 24%), hsl(${(hue + 40) % 360} 30% 10%))` }}>
          <${Icon} name="Clapperboard" size=${20} class="text-white/40 mb-1" />
          <span class="text-[11px] font-semibold text-white/75 line-clamp-3 leading-tight">${title}</span>
        </div>`;
      }
      return html`<img src=${img(path, size)} alt=${title} loading="lazy" decoding="async"
        onError=${() => setErr(true)} class=${'object-cover bg-card2 ' + cls} />`;
    }

    // Tarjeta de póster para cuadrículas y carruseles
    function PosterCard({ item, sub, badge }) {
      const { titles } = useStore();
      const type = item.media_type || item.type;
      const title = item.title || item.name || '';
      const saved = titles[keyOf(type, item.id)];
      const year = yearOf(item.release_date || item.first_air_date);
      return html`<button class="press text-left w-full" onClick=${() => openTitle(type, item.id)}>
        <div class="relative">
          <${Poster} path=${item.poster_path} title=${title} id=${item.id} class="w-full aspect-[2/3] rounded-xl shadow-soft" />
          ${badge && html`<span class="absolute top-1.5 left-1.5 px-1.5 py-0.5 rounded-md bg-accent text-black text-[10px] font-bold">${badge}</span>`}
          ${saved && saved.status && html`<span class="absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-black/70 backdrop-blur flex items-center justify-center text-accent">
            <${Icon} name=${saved.status === 'watched' ? 'Check' : saved.status === 'watching' ? 'Eye' : 'Bookmark'} size=${13} strokeWidth=${2.5} />
          </span>`}
        </div>
        <div class="mt-1.5 text-[13px] font-medium leading-tight line-clamp-2">${title}</div>
        <div class="text-[11px] text-zinc-500 mt-0.5">${sub || [year, type === 'tv' ? 'Serie' : 'Película'].filter(Boolean).join(' · ')}</div>
      </button>`;
    }

    const PosterGrid = ({ items, subFn }) => html`<div class="grid grid-cols-3 gap-x-3 gap-y-4">
      ${items.map((it) => html`<${PosterCard} key=${(it.media_type || it.type) + it.id} item=${it} sub=${subFn && subFn(it)} />`)}

    const SkeletonGrid = ({ n = 9 }) => html`<div class="grid grid-cols-3 gap-x-3 gap-y-4">

    function EmptyState({ icon = 'Popcorn', title, text, action }) {

    function Section({ title, icon, right, children }) {

    // Estrellas de 1 a 5 (pulsar la misma estrella otra vez la borra)
    function Stars({ value = 0, onChange, size = 30 }) {

          disabled=${!onChange} onClick=${() => onChange && onChange(value === n ? 0 : n)}>
          <${Icon} name="Star" size=${size} fill=${n <= value ? 'currentColor' : 'none'} strokeWidth=${1.8}
            class=${n <= value ? 'text-accent' : 'text-zinc-600'} />

    // Cabecera de las pestañas: título, campana con contador y ajustes
    function TopBar({ title }) {

        <div class="h-14 pl-4 pr-1 flex items-center gap-1">
          <h1 class="text-[24px] font-extrabold tracking-tight flex-1 truncate">${title}</h1>
          ${!settings.apiKey && html`<button class="h-8 px-3 mr-1 rounded-full bg-accent/15 text-accent text-xs font-semibold" onClick=${() => navigate('/ajustes')}>Modo demo</button>`}
          <button class="icon-btn relative" aria-label="Avisos" onClick=${() => navigate('/avisos')}>
            <${Icon} name="Bell" size=${22} />
            ${unread > 0 && html`<span class="absolute top-1.5 right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-accent text-black text-[11px] font-bold flex items-center justify-center">${unread > 9 ? '9+' : unread}</span>`}
          </button>
          <button class="icon-btn" aria-label="Ajustes" onClick=${() => navigate('/ajustes')}><${Icon} name="Settings" size=${22} /></button>
        </div>
      </header>`;
    }

    // Página superpuesta con botón de volver (Ajustes, Avisos)
    function OverlayPage({ title, right, children }) {
      return html`<div class="fixed inset-0 z-30 bg-base overflow-y-auto overscroll-contain overlay-enter px-safe">
        <header class="sticky top-0 z-10 bg-base/85 backdrop-blur-xl pt-safe">
          <div class="h-14 px-1 flex items-center gap-1">
            <button class="icon-btn" aria-label="Volver" onClick=${() => goBack()}><${Icon} name="ChevronLeft" size=${28} /></button>
            <h1 class="text-lg font-bold flex-1 truncate">${title}</h1>
            ${right}
          </div>
        </header>
        <div class="px-4 page-end">${children}</div>
      </div>`;
    }

    const TABS = [
      { id: 'inicio', label: 'Inicio', icon: 'House' },
      { id: 'buscar', label: 'Buscar', icon: 'Search' },
      { id: 'lista', label: 'Mi lista', icon: 'ListVideo' },
      { id: 'descubrir', label: 'Descubrir', icon: 'Compass' }
    ];
    function BottomNav({ active, onTab }) {
      return html`<nav class="fixed bottom-0 inset-x-0 z-20 bg-base/90 backdrop-blur-xl border-t border-line/70 pb-safe px-safe">
        <div class="grid grid-cols-4 h-[60px]">
          ${TABS.map((t) => html`<button key=${t.id} onClick=${() => onTab(t.id)}
            class=${'flex flex-col items-center justify-center gap-0.5 transition-colors ' + (active === t.id ? 'text-accent' : 'text-zinc-500')}>
            <${Icon} name=${t.icon} size=${24} strokeWidth=${active === t.id ? 2.4 : 2} />
            <span class="text-[10.5px] font-medium">${t.label}</span>
          </button>`)}
        </div>
      </nav>`;
    }

    function ToastHost() {
      const [items, setItems] = useState([]);
      useEffect(() => {
        const on = (e) => {
          const id = Math.random();
          setItems((x) => [...x.slice(-1), { id, msg: e.detail }]);
          setTimeout(() => setItems((x) => x.filter((i) => i.id !== id)), 3500);
        };
        window.addEventListener('ms-toast', on);
        return () => window.removeEventListener('ms-toast', on);
      }, []);
      return html`<div class="fixed inset-x-0 z-[70] flex flex-col items-center gap-2 pointer-events-none px-4 toast-pos">
        ${items.map((i) => html`<div key=${i.id} class="pop-in max-w-sm px-4 py-2.5 rounded-2xl bg-card2/95 backdrop-blur border border-line text-[13px] text-zinc-200 shadow-soft flex items-center gap-2">
          <${Icon} name="Info" size=${16} class="text-accent shrink-0" /><span>${i.msg}</span>
        </div>`)}
      </div>`;
    }

    // Diálogo de confirmación propio (más nativo que window.confirm)
    let openDialog = null;
    const confirmDialog = (opts) => new Promise((resolve) => (openDialog ? openDialog({ ...opts, resolve }) : resolve(window.confirm(opts.message))));
    function DialogHost() {
      const [d, setD] = useState(null);
      openDialog = setD;
      if (!d) return null;
      const close = (v) => { d.resolve(v); setD(null); };
      return html`<div class="fixed inset-0 z-[80] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-4 pb-safe" onClick=${() => close(false)}>
        <div class="pop-in w-full max-w-sm rounded-3xl bg-card2 border border-line p-5 shadow-soft mb-4" onClick=${(e) => e.stopPropagation()}>

          <div class="grid grid-cols-2 gap-2 mt-5">
            <button class="press h-12 rounded-2xl bg-card text-zinc-200 font-semibold" onClick=${() => close(false)}>Cancelar</button>
            <button class=${'press h-12 rounded-2xl font-semibold ' + (d.danger ? 'bg-rose-500 text-white' : 'bg-accent text-black')} onClick=${() => close(true)}>${d.confirmText || 'Aceptar'}</button>
          </div>
        </div>
      </div>`;
    }

    // Teclado numérico para el PIN
    function PinPad({ title, subtitle, onComplete }) {
      const [pin, setPin] = useState('');
      const [shake, setShake] = useState(false);
      const busy = useRef(false);
      const pinRef = useRef('');
      pinRef.current = pin;

      const press = async (k) => {
        if (busy.current) return;
        if (k === 'del') { setPin((p) => p.slice(0, -1)); return; }
        const p = (pinRef.current + k).slice(0, 4);
        setPin(p);
        if (p.length === 4) {
          busy.current = true;
          await sleep(160);
          let ok = true;
          try { ok = await onComplete(p); } catch (e) { ok = false; }
          busy.current = false;
          if (ok === false) { setShake(true); navigator.vibrate && navigator.vibrate(80); setTimeout(() => setShake(false), 420); }
          setPin('');
        }
      };
      // Teclado físico (por si acaso)
      useEffect(() => {
        const on = (e) => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); };
        window.addEventListener('keydown', on);
        return () => window.removeEventListener('keydown', on);
      }, []);

      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'];
      return html`<div class="flex flex-col items-center no-select">
        <div class="text-lg font-semibold">${title}</div>
        ${subtitle && html`<div class="text-sm text-zinc-400 mt-1">${subtitle}</div>`}
        <div class=${'flex gap-4 my-8 ' + (shake ? 'shake' : '')}>
          ${[0, 1, 2, 3].map((i) => html`<span key=${i} class=${'w-3.5 h-3.5 rounded-full border-2 transition-colors ' + (i < pin.length ? 'bg-accent border-accent' : 'border-zinc-600')}></span>`)}
        </div>
        <div class="grid grid-cols-3 gap-4">
          ${keys.map((k, i) => k === ''
            ? html`<span key=${i}></span>`
            : html`<button key=${i} aria-label=${k === 'del' ? 'Borrar' : k} onClick=${() => press(k)}
                class=${'w-[74px] h-[74px] rounded-full text-2xl font-medium flex items-center justify-center transition active:scale-95 ' + (k === 'del' ? 'text-zinc-400 active:bg-white/5' : 'bg-card2 active:bg-zinc-700')}>
                ${k === 'del' ? html`<${Icon} name="Delete" size=${26} />` : k}
              </button>`)}
        </div>
      </div>`;
    }

    // Formulario para la clave de TMDB (bienvenida y ajustes)
    function ApiKeyForm({ onSaved }) {
      const [val, setVal] = useState('');

      const test = async () => {
        const key = val.trim();

          await tmdb('/authentication', {}, { key, cacheMs: 0 });
          setSt({ s: 'ok' });

        store.set('settings', (s) => ({ ...s, apiKey: val.trim(), lastCheck: 0 }));

        setVal(''); setSt({ s: 'idle' });

      return html`<div>
        <textarea rows="3" value=${val} placeholder="Pega aquí tu token de lectura (eyJhbGci…) o tu API key"
          autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"
          onInput=${(e) => { setVal(e.target.value); setSt({ s: 'idle' }); }}
          class="w-full rounded-2xl bg-card2 border border-line focus:border-accent outline-none p-3 font-mono text-[13px] text-zinc-200 resize-none placeholder:text-zinc-500 placeholder:font-sans"></textarea>
        ${st.s === 'ok' && html`<div class="mt-2 text-sm text-emerald-400 flex items-center gap-1.5"><${Icon} name="Check" size=${16} />Conexión correcta</div>`}
        ${st.s === 'error' && html`<div class="mt-2 text-sm text-rose-400">${st.msg}</div>`}
        <div class="grid grid-cols-2 gap-2 mt-3">
          <button class="press h-12 rounded-2xl bg-card2 border border-line font-semibold disabled:opacity-40 flex items-center justify-center gap-2"
            disabled=${!val.trim() || st.s === 'testing'} onClick=${test}>

            Probar conexión
          </button>
          <button class="press h-12 rounded-2xl bg-accent text-black font-semibold disabled:opacity-40" disabled=${st.s !== 'ok'} onClick=${saveKey}>Guardar</button>
        </div>
      </div>`;
    }

    /* =====================================================================
       PANTALLAS
       ===================================================================== */

    // ---------- Bienvenida (primera vez) ----------
    function WelcomeScreen() {
      return html`<div class="min-h-screen pt-safe pb-safe px-safe screen-enter">
        <div class="px-6 pt-10 pb-10 max-w-md mx-auto">

          <h1 class="text-3xl font-extrabold mt-6 tracking-tight">Bienvenido a <span class="text-accent">Mis Series</span></h1>
