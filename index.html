    }

    // ---------- Bloqueo por PIN ----------
    function LockScreen({ onUnlock }) {
      const verify = async (pin) => {
        const ok = (await sha256Pin(pin)) === store.state.settings.pinHash;
        if (ok) onUnlock();
        return ok;
      };
      const reset = async () => {
        const ok = await confirmDialog({ title: '¿Restablecer la app?', message: 'Se borrarán todos tus datos (listas, notas, PIN y clave) de este dispositivo. No se puede deshacer.', confirmText: 'Borrar todo', danger: true });
        if (ok) { PERSISTED.forEach(removeKey); location.reload(); }
      };
      return html`<div class="fixed inset-0 bg-base flex flex-col items-center justify-center pt-safe pb-safe">
        <div class="w-14 h-14 rounded-2xl bg-accent/10 text-accent flex items-center justify-center mb-6"><${Icon} name="Lock" size=${28} /></div>
        <${PinPad} title="Introduce tu PIN" subtitle="Mis Series está protegida" onComplete=${verify} />
        <button class="mt-8 h-11 px-4 text-sm text-zinc-500" onClick=${reset}>¿Olvidaste el PIN?</button>
      </div>`;
    }

    // ---------- Inicio ----------
    function HomeScreen() {
      const { titles, checking, settings } = useStore();
      const all = Object.values(titles);
      const today = todayStr();
      const followed = all.filter((t) => t.type === 'tv' && t.followed);
      const upcoming = followed
        .filter((t) => t.nextEpisode && t.nextEpisode.date && t.nextEpisode.date >= today)
        .sort((a, b) => a.nextEpisode.date.localeCompare(b.nextEpisode.date));
      const newSeasons = all.filter((t) => t.type === 'tv' && t.newSeason);
      const trending = useApi(() => tmdb('/trending/all/week'), [settings.apiKey]);
      const trendItems = ((trending.data && trending.data.results) || []).filter((x) => x.media_type === 'movie' || x.media_type === 'tv').slice(0, 18);

      return html`<div>
        <${TopBar} title="Mis Series" />
        <div class="px-4">
          <${Section} title="Próximos episodios de mis series" icon="CalendarDays"
            right=${followed.length > 0 && html`<button class="icon-btn text-zinc-400" aria-label="Comprobar novedades" onClick=${() => checkFollowedSeries({ force: true })}>
              <${Icon} name="RefreshCw" size=${18} class=${checking ? 'animate-spin' : ''} /></button>`}>
            ${followed.length === 0
              ? html`<${EmptyState} icon="BellRing" title="Aún no sigues ninguna serie"
                  text="Abre una serie y pulsa «Seguir serie» para ver aquí sus próximos episodios."
                  action=${{ label: 'Buscar una serie', onClick: () => navigate('/buscar', { replace: true }) }} />`
              : upcoming.length === 0
                ? html`<div class="rounded-2xl bg-card p-4 text-sm text-zinc-400">Ninguna de tus series tiene episodios anunciados ahora mismo. Te avisaremos cuando cambie.</div>`
                : html`<div class="space-y-2.5">${upcoming.map((t) => html`<${UpcomingRow} key=${t.id} t=${t} />`)}</div>`}
          <//>

          ${newSeasons.length > 0 && html`<${Section} title="Nuevas temporadas" icon="Sparkles">
            <div class="flex gap-3 overflow-x-auto no-scrollbar snap-x-row -mx-4 px-4">
              ${newSeasons.map((t) => html`<div key=${t.id} class="w-[31%] shrink-0">
                <${PosterCard} item=${{ id: t.id, media_type: 'tv', name: t.title, poster_path: t.poster }} badge="¡Nueva temporada!" sub=${`Temporada ${t.knownSeasons}`} />
              </div>`)}
            </div>
          <//>`}

          <${Section} title="Tendencias esta semana" icon="TrendingUp">
            ${trending.loading ? html`<${SkeletonGrid} n=${9} />`
              : trendItems.length ? html`<${PosterGrid} items=${trendItems} />`
              : html`<${EmptyState} icon="WifiOff" title="No hay tendencias ahora" text="Comprueba tu conexión e inténtalo más tarde." />`}
          <//>
        </div>
      </div>`;
    }

    function UpcomingRow({ t }) {
      const ep = t.nextEpisode;
      const n = daysUntil(ep.date);
      const soon = n <= 1;
      return html`<button class="press w-full flex items-center gap-3 p-2.5 rounded-2xl bg-card text-left shadow-soft" onClick=${() => openTitle('tv', t.id)}>
        <${Poster} path=${t.poster} title=${t.title} id=${t.id} size="w185" class="w-12 h-[72px] rounded-lg shrink-0" />
        <div class="flex-1 min-w-0">
          <div class="font-semibold truncate">${t.title}</div>
          <div class="text-xs text-zinc-400 truncate mt-0.5">T${ep.season} · E${ep.episode}${ep.name ? ` · ${ep.name}` : ''}</div>
          <div class="text-[11px] text-zinc-500 mt-0.5 capitalize">${fmtDate(ep.date, { weekday: 'long', day: 'numeric', month: 'long' })}</div>
        </div>
        <span class=${'shrink-0 px-2.5 h-7 rounded-full text-xs font-bold flex items-center ' + (soon ? 'bg-accent text-black' : 'bg-accent/15 text-accent')}>${countdown(ep.date)}</span>
      </button>`;
    }

    // ---------- Buscar ----------
    function SearchScreen() {
      const [q, setQ] = useState('');
      const [dq, setDq] = useState('');
      const [filter, setFilter] = useState('all');
      const inputRef = useRef(null);
      // Debounce de 400 ms
      useEffect(() => { const t = setTimeout(() => setDq(q.trim()), 400); return () => clearTimeout(t); }, [q]);
      const res = useApi(() => (dq ? tmdb('/search/multi', { query: dq, include_adult: 'false' }) : null), [dq]);
      const results = ((res.data && res.data.results) || [])
        .filter((x) => x.media_type === 'movie' || x.media_type === 'tv')
        .filter((x) => filter === 'all' || x.media_type === filter);
      const FILTERS = [{ id: 'all', label: 'Todo' }, { id: 'movie', label: 'Películas' }, { id: 'tv', label: 'Series' }];

      return html`<div>
        <${TopBar} title="Buscar" />
        <div class="sticky z-10 bg-base/85 backdrop-blur-xl px-4 pb-3" style=${{ top: 'calc(env(safe-area-inset-top) + 56px)' }}>
          <div class="flex items-center gap-2 h-12 px-3 rounded-2xl bg-card2 border border-line focus-within:border-accent transition-colors">
            <${Icon} name="Search" size=${20} class="text-zinc-500" />
            <input ref=${inputRef} type="search" enterkeyhint="search" value=${q} placeholder="Películas y series…"
              autocapitalize="off" autocorrect="off" autocomplete="off"
              onInput=${(e) => setQ(e.target.value)} onKeyDown=${(e) => e.key === 'Enter' && e.target.blur()}
              class="flex-1 bg-transparent outline-none text-zinc-100 placeholder:text-zinc-500 min-w-0" />
            ${q && html`<button class="w-9 h-9 -mr-1 flex items-center justify-center text-zinc-400" aria-label="Borrar búsqueda" onClick=${() => { setQ(''); inputRef.current && inputRef.current.focus(); }}><${Icon} name="X" size=${18} /></button>`}
          </div>
          <div class="flex gap-2 mt-3">
            ${FILTERS.map((f) => html`<button key=${f.id} onClick=${() => setFilter(f.id)}
              class=${'h-9 px-4 rounded-full text-sm font-medium transition-colors ' + (filter === f.id ? 'bg-accent text-black' : 'bg-card2 text-zinc-300')}>${f.label}</button>`)}
          </div>
        </div>
        <div class="px-4 pt-2">
          ${!dq ? html`<${EmptyState} icon="Search" title="¿Qué te apetece ver?" text="Escribe el título de una película o serie para buscarla en TMDB." />`
            : res.loading ? html`<${SkeletonGrid} n=${9} />`
            : results.length ? html`<${PosterGrid} items=${results} />`
            : html`<${EmptyState} icon="SearchX" title=${`Sin resultados para «${dq}»`} text="Prueba con otro título o revisa cómo está escrito." />`}
        </div>
      </div>`;
    }

    // ---------- Mi lista ----------
    const LIST_TABS = [{ id: 'watching', label: 'Viendo' }, { id: 'pending', label: 'Pendientes' }, { id: 'watched', label: 'Vistas' }];
    function ListScreen() {
      const { titles, watchedEpisodes } = useStore();
      const [tab, setTab] = useState('watching');
      const all = Object.values(titles);
      const items = all.filter((t) => t.status === tab).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      const count = (s) => all.filter((t) => t.status === s).length;
      return html`<div>
        <${TopBar} title="Mi lista" />
        <div class="px-4">
          <div class="grid grid-cols-3 p-1 rounded-2xl bg-card2 mt-1">
            ${LIST_TABS.map((t) => html`<button key=${t.id} onClick=${() => setTab(t.id)}
              class=${'h-10 rounded-xl text-sm font-semibold transition-all ' + (tab === t.id ? 'bg-accent text-black shadow-glow' : 'text-zinc-400')}>
              ${t.label}<span class="opacity-60 font-normal"> ${count(t.id)}</span></button>`)}
          </div>
          <div class="mt-4 space-y-2.5">
            ${items.length === 0
              ? html`<${EmptyState} icon="Popcorn" title="Todavía no has añadido nada"
                  text=${all.length === 0 ? 'Busca tu primera serie y márcala como Pendiente, Viendo o Vista.' : 'No tienes títulos en esta lista todavía.'}
                  action=${{ label: 'Buscar', onClick: () => navigate('/buscar', { replace: true }) }} />`
              : items.map((t) => html`<${ListRow} key=${t.type + t.id} t=${t} watched=${watchedEpisodes[t.id]} />`)}
          </div>
        </div>
      </div>`;
    }

    function ListRow({ t, watched }) {
      let progress = '', pct = null;
      if (t.type === 'tv') { const p = seriesProgress(t, watched || {}); progress = p.label; pct = p.pct; }
      else progress = t.runtime ? fmtRuntime(t.runtime) : '';
      return html`<button class="press w-full flex gap-3 p-2.5 rounded-2xl bg-card text-left shadow-soft" onClick=${() => openTitle(t.type, t.id)}>
        <${Poster} path=${t.poster} title=${t.title} id=${t.id} size="w185" class="w-16 h-24 rounded-xl shrink-0" />
        <div class="flex-1 min-w-0 py-0.5 flex flex-col">
          <div class="font-semibold leading-tight line-clamp-2">${t.title}</div>
          <div class="text-xs text-zinc-500 mt-1 flex items-center gap-1">
            <${Icon} name=${t.type === 'tv' ? 'Tv' : 'Film'} size=${12} />${t.type === 'tv' ? 'Serie' : 'Película'}${t.year ? ' · ' + t.year : ''}
            ${t.followed && html`<${Icon} name="BellRing" size=${12} class="text-accent ml-1" />`}
          </div>
          <div class="mt-auto">
            ${t.rating > 0 && html`<div class="flex gap-0.5 text-accent mb-1">${Array.from({ length: t.rating }, (_, i) => html`<${Icon} key=${i} name="Star" size=${12} fill="currentColor" />`)}</div>`}
            ${progress && html`<div class="text-xs text-zinc-300">${progress}</div>`}
            ${pct != null && html`<div class="h-1 rounded-full bg-zinc-800 mt-1.5 overflow-hidden"><div class="h-full bg-accent rounded-full transition-all" style=${{ width: `${Math.round(pct * 100)}%` }}></div></div>`}
          </div>
        </div>
        <${Icon} name="ChevronRight" size=${18} class="text-zinc-600 self-center shrink-0" />
      </button>`;
    }

    // ---------- Descubrir ----------
    function DiscoverScreen() {
      const { titles, settings } = useStore();
      const liked = Object.values(titles)
        .filter((t) => t.status === 'watched' && t.rating >= 4)
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
        .slice(0, 6);
      const likedKey = liked.map((t) => keyOf(t.type, t.id)).join(',');

      // Mezcla las recomendaciones de tus favoritos, sin repetir lo que ya tienes
      const recos = useApi(() => {
        if (!liked.length) return null;
        return (async () => {
          const map = new Map();
          for (let i = 0; i < liked.length; i++) {
            const t = liked[i];
            if (i) await sleep(250);
            try {
              const d = await tmdb(`/${t.type}/${t.id}`, DETAIL_PARAMS);
              for (const r of (d.recommendations && d.recommendations.results) || []) {
                const type = r.media_type || t.type;
                const k = keyOf(type, r.id);
                if (store.state.titles[k]) continue;
                const e = map.get(k) || { item: { ...r, media_type: type }, score: 0, because: t.title };
                e.score += 1 + (r.vote_average || 0) / 20;
                map.set(k, e);
              }
            } catch (e) { reportError(e); }
          }
          return [...map.values()].sort((a, b) => b.score - a.score).slice(0, 18);
        })();
      }, [likedKey, settings.apiKey]);

      const upcoming = useApi(() => tmdb('/movie/upcoming'), [settings.apiKey]);
      const today = todayStr();
      const upItems = ((upcoming.data && upcoming.data.results) || [])
        .filter((m) => m.release_date && m.release_date >= today)
        .sort((a, b) => a.release_date.localeCompare(b.release_date))
        .map((m) => ({ ...m, media_type: 'movie' }));

      return html`<div>
        <${TopBar} title="Descubrir" />
        <div class="px-4">
          <${Section} title="Recomendado para ti" icon="Sparkles">
            ${!liked.length
              ? html`<${EmptyState} icon="Star" title="Puntúa lo que has visto"
                  text="Marca títulos como «Vista» y dales 4 o 5 estrellas. Te recomendaremos cosas parecidas." />`
              : recos.loading ? html`<${SkeletonGrid} n=${6} />`
              : recos.data && recos.data.length
                ? html`<${PosterGrid} items=${recos.data.map((r) => ({ ...r.item, _because: r.because }))} subFn=${(it) => `Por «${it._because}»`} />`
                : html`<${EmptyState} icon="Compass" title="Sin recomendaciones nuevas" text="Puntúa más títulos para afinar las sugerencias." />`}
          <//>
          <${Section} title="Próximos estrenos en cines" icon="Popcorn">
            ${upcoming.loading ? html`<${SkeletonGrid} n=${6} />`
              : upItems.length ? html`<${PosterGrid} items=${upItems} subFn=${(m) => `${fmtDate(m.release_date, { day: 'numeric', month: 'short' })} · ${countdown(m.release_date)}`} />`
              : html`<${EmptyState} icon="CalendarDays" title="No hay estrenos anunciados" text="Vuelve a mirar en unos días." />`}
          <//>
        </div>
      </div>`;
    }

    // ---------- Detalle de película / serie ----------
    function DetailScreen({ type, id }) {
      const st = useStore();
      const k = keyOf(type, id);
      const saved = st.titles[k];
      const res = useApi(() => tmdb(`/${type}/${id}`, DETAIL_PARAMS), [type, id, st.settings.apiKey]);
      const d = res.data;

      // Al abrir, quitamos la marca de "nueva temporada" (ya la has visto)
      useEffect(() => { if (store.state.titles[k] && store.state.titles[k].newSeason) upsertTitle(type, id, { newSeason: false }, { touch: false }); }, []);
      // Con datos frescos, actualizamos lo guardado (y avisamos si hay cambios)
      useEffect(() => {
        if (!d || !store.state.titles[k]) return;
        if (type === 'tv') applySeriesUpdate(id, d);
        else upsertTitle(type, id, baseInfo(type, d), { touch: false });
      }, [d]);

      // Guarda cambios del usuario añadiendo los datos básicos del título
      const save = (patch) => {
        const extra = d ? baseInfo(type, d) : {};
        if (type === 'tv' && d && !(saved && saved.knownSeasons)) extra.knownSeasons = d.number_of_seasons || 0;
        upsertTitle(type, id, { ...extra, ...patch });
      };
      const setStatus = (s) => save({ status: saved && saved.status === s ? null : s });
      const toggleFollow = () => {
        const f = !(saved && saved.followed);
        save({ followed: f, ...(f && !(saved && saved.status) ? { status: 'watching' } : {}) });
        toast(f ? 'Te avisaremos de nuevos episodios y temporadas' : 'Has dejado de seguir esta serie');
      };
      const onEpisodesChange = (on) => { if (on && !(saved && saved.status)) save({ status: 'watching' }); };

      const title = (d && (d.title || d.name)) || (saved && saved.title) || '';
      const backdrop = (d && d.backdrop_path) || (saved && saved.backdrop);
      const poster = (d && d.poster_path) || (saved && saved.poster);
      const year = d ? yearOf(d.release_date || d.first_air_date) : saved && saved.year;
      const meta = d
        ? [year, type === 'tv' ? plural(d.number_of_seasons || 0, 'temporada', 'temporadas') : fmtRuntime(d.runtime)].filter(Boolean).join(' · ')
        : year;
      const genres = d ? (d.genres || []).map((g) => g.name).join(' · ') : '';
      const tvSt = type === 'tv' && TV_STATUS[(d && d.status) || (saved && saved.tvStatus)];
      const providers = (d && d['watch/providers'] && d['watch/providers'].results && d['watch/providers'].results.ES && d['watch/providers'].results.ES.flatrate) || [];
      const recs = ((d && d.recommendations && d.recommendations.results) || []).slice(0, 12).map((r) => ({ ...r, media_type: r.media_type || type }));

      const STATUS_BTNS = [
        { id: 'pending', label: 'Pendiente', icon: 'Bookmark' },
        { id: 'watching', label: 'Viendo', icon: 'Eye' },
        { id: 'watched', label: 'Vista', icon: 'Check' }
      ];

      return html`<div class="fixed inset-0 z-30 bg-base overflow-y-auto overscroll-contain overlay-enter px-safe">
        <!-- Cabecera con backdrop -->
        <div class="relative h-[min(62vw,340px)] bg-card">
          ${backdrop ? html`<img src=${img(backdrop, 'w780')} alt="" class="w-full h-full object-cover" />`
            : res.loading ? html`<div class="skeleton w-full h-full"></div>`
            : html`<div class="w-full h-full bg-gradient-to-br from-zinc-800 to-base"></div>`}
          <div class="absolute inset-0 bg-gradient-to-t from-base via-base/40 to-black/30"></div>
          <button class="icon-btn absolute left-3 top-safe bg-black/45 backdrop-blur text-white" aria-label="Volver" onClick=${() => goBack()}>
            <${Icon} name="ChevronLeft" size=${26} />
          </button>
        </div>

        <div class="px-4 -mt-24 relative flex gap-4 items-end">
          ${poster || title ? html`<${Poster} path=${poster} title=${title} id=${id} class="w-28 aspect-[2/3] rounded-2xl shadow-soft shrink-0 border border-white/10" />`
            : html`<div class="skeleton w-28 aspect-[2/3] rounded-2xl shrink-0"></div>`}
          <div class="flex-1 min-w-0 pb-1">
            ${title ? html`<h1 class="text-[22px] font-extrabold leading-tight">${title}</h1>` : html`<div class="skeleton h-6 rounded w-3/4"></div>`}
            <div class="text-sm text-zinc-400 mt-1">${meta}</div>
            ${tvSt && html`<span class=${'inline-block mt-2 px-2 py-0.5 rounded-md text-[11px] font-semibold ' + tvSt.cls}>${tvSt.label}</span>`}
          </div>
        </div>
        ${genres && html`<div class="px-4 mt-3 text-[13px] text-zinc-400">${genres}</div>`}

        <div class="px-4 page-end">
          <!-- Estado -->
          <div class="grid grid-cols-3 gap-2 mt-5">
            ${STATUS_BTNS.map((b) => {
              const on = saved && saved.status === b.id;
              return html`<button key=${b.id} onClick=${() => setStatus(b.id)} disabled=${!title}
                class=${'press h-14 rounded-2xl flex flex-col items-center justify-center gap-0.5 text-[13px] font-semibold transition-colors ' + (on ? 'bg-accent text-black shadow-glow' : 'bg-card text-zinc-300')}>
                <${Icon} name=${b.icon} size=${19} strokeWidth=${on ? 2.6 : 2} />${b.label}
              </button>`;
            })}
          </div>

          ${type === 'tv' && html`<button onClick=${toggleFollow} disabled=${!title}
            class=${'press w-full mt-2 h-12 rounded-2xl flex items-center justify-center gap-2 font-semibold transition-colors ' + (saved && saved.followed ? 'bg-accent/15 text-accent border border-accent/40' : 'bg-card text-zinc-200')}>
            <${Icon} name=${saved && saved.followed ? 'BellRing' : 'Bell'} size=${19} />
            ${saved && saved.followed ? 'Siguiendo · avisos activados' : 'Seguir serie'}
          </button>`}

          <!-- Puntuación y notas -->
          <div class="mt-5 rounded-2xl bg-card p-3">
            <div class="text-xs uppercase tracking-wide text-zinc-500 font-semibold px-1">Mi puntuación</div>
            <div class="-ml-1.5"><${Stars} value=${(saved && saved.rating) || 0} onChange=${(v) => save({ rating: v })} /></div>
            <${NotesField} key=${k} value=${(saved && saved.notes) || ''} onSave=${(notes) => save({ notes })} />
          </div>

          ${res.loading && !d && html`<div class="mt-6 space-y-2"><div class="skeleton h-3.5 rounded"></div><div class="skeleton h-3.5 rounded w-11/12"></div><div class="skeleton h-3.5 rounded w-4/5"></div></div>`}
          ${res.error && !d && html`<div class="mt-6 rounded-2xl bg-card p-4 text-sm text-zinc-400 flex gap-2"><${Icon} name="WifiOff" size=${18} class="shrink-0" />No se pudo cargar la información de TMDB. Tus datos guardados siguen aquí.</div>`}

          ${d && d.overview && html`<div class="mt-6">
            <h2 class="text-[17px] font-bold mb-1.5">Sinopsis</h2>
            <p class="text-[15px] leading-relaxed text-zinc-300">${d.overview}</p>
          </div>`}

          ${d && type === 'tv' && html`<${NextEpisodeCard} d=${d} />`}

          ${d && html`<div class="mt-6">
            <h2 class="text-[17px] font-bold mb-2">Dónde verlo en España</h2>
            ${providers.length
              ? html`<div class="flex flex-wrap gap-2">${providers.map((p) => html`<div key=${p.provider_id} class="flex items-center gap-2 h-11 pl-1.5 pr-3 rounded-xl bg-card">
                  ${p.logo_path ? html`<img src=${img(p.logo_path, 'w92')} alt="" class="w-8 h-8 rounded-lg" loading="lazy" />` : html`<div class="w-8 h-8 rounded-lg bg-card2 flex items-center justify-center"><${Icon} name="Tv" size=${16} class="text-zinc-400" /></div>`}
                  <span class="text-sm">${p.provider_name}</span></div>`)}</div>
                <div class="text-[11px] text-zinc-600 mt-2">Disponibilidad por suscripción · datos de JustWatch vía TMDB</div>`
              : html`<p class="text-sm text-zinc-400">No está incluida en ninguna plataforma de suscripción en España ahora mismo.</p>`}
          </div>`}

          ${d && type === 'tv' && html`<${SeasonList} tvId=${id} d=${d} onEpisodesChange=${onEpisodesChange} />`}

          ${recs.length > 0 && html`<div class="mt-7">
            <h2 class="text-[17px] font-bold mb-3">Si te gusta, prueba con…</h2>
            <div class="flex gap-3 overflow-x-auto no-scrollbar snap-x-row -mx-4 px-4">
              ${recs.map((r) => html`<div key=${r.id} class="w-[29%] shrink-0"><${PosterCard} item=${r} /></div>`)}
            </div>
          </div>`}
        </div>
      </div>`;
    }

    // Notas con guardado automático
    function NotesField({ value, onSave }) {
      const [v, setV] = useState(value);
      const first = useRef(true);
      useEffect(() => {
        if (first.current) { first.current = false; return; }
        const t = setTimeout(() => onSave(v), 600);
        return () => clearTimeout(t);
      }, [v]);
      return html`<textarea rows="3" value=${v} placeholder="Mis notas…" onInput=${(e) => setV(e.target.value)} onBlur=${() => v !== value && onSave(v)}
        class="w-full mt-2 rounded-xl bg-card2 border border-line focus:border-accent outline-none p-3 text-zinc-200 placeholder:text-zinc-500 resize-none"></textarea>`;
    }

    function NextEpisodeCard({ d }) {
      const next = d.next_episode_to_air;
      const last = d.last_episode_to_air;
      const ended = d.status === 'Ended' || d.status === 'Canceled';
      return html`<div class="mt-6 rounded-2xl bg-card p-4">
        <div class="flex items-center gap-2 text-xs uppercase tracking-wide text-zinc-500 font-semibold"><${Icon} name="CalendarDays" size=${14} />Próximo episodio</div>
        ${next
          ? html`<div class="mt-2 flex items-center gap-3">
              <div class="flex-1 min-w-0">
                <div class="font-semibold">T${next.season_number} · E${next.episode_number}${next.name ? ` · ${next.name}` : ''}</div>
                <div class="text-sm text-zinc-400 capitalize">${fmtDate(next.air_date, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) || 'Fecha por confirmar'}</div>
              </div>
              ${next.air_date && html`<span class="px-2.5 h-7 rounded-full text-xs font-bold flex items-center bg-accent text-black shrink-0">${countdown(next.air_date)}</span>`}
            </div>`
          : html`<div class="mt-2 text-sm text-zinc-300">${ended ? `La serie está ${d.status === 'Ended' ? 'finalizada' : 'cancelada'}: no habrá más episodios.` : 'Todavía no hay fecha anunciada para el próximo episodio.'}</div>`}
        ${last && html`<div class="text-xs text-zinc-500 mt-2">Último emitido: T${last.season_number}·E${last.episode_number}${last.air_date ? ` · ${fmtDate(last.air_date, { day: 'numeric', month: 'short', year: 'numeric' })}` : ''}</div>`}
      </div>`;
    }

    // Temporadas desplegables con casillas por episodio
    function SeasonList({ tvId, d, onEpisodesChange }) {
      const { watchedEpisodes } = useStore();
      const w = watchedEpisodes[tvId] || {};
      const seasons = (d.seasons || []).filter((s) => s.season_number > 0);
      const total = seasons.reduce((a, s) => a + (s.episode_count || 0), 0);
      const seen = Object.values(w).reduce((a, l) => a + l.length, 0);
      if (!seasons.length) return null;
      return html`<div class="mt-7">
        <div class="flex items-end mb-3">
          <h2 class="text-[17px] font-bold flex-1">Temporadas</h2>
          <span class="text-xs text-zinc-400">${seen}/${total} episodios vistos</span>
        </div>
        <div class="space-y-2">
          ${seasons.map((s) => html`<${SeasonItem} key=${s.season_number} tvId=${tvId} season=${s} watched=${w[s.season_number] || []} onEpisodesChange=${onEpisodesChange} />`)}
        </div>
      </div>`;
    }

    function SeasonItem({ tvId, season, watched, onEpisodesChange }) {
      const [open, setOpen] = useState(false);
      const [eps, setEps] = useState(null);
      const n = season.season_number;
      const count = season.episode_count || 0;
      useEffect(() => {
        if (!open || eps) return;
        tmdb(`/tv/${tvId}/season/${n}`).then((r) => setEps(r.episodes || [])).catch((e) => { reportError(e); setEps([]); });
      }, [open]);

      const today = todayStr();
      const aired = (eps || []).filter((e) => !e.air_date || e.air_date <= today).map((e) => e.episode_number);
      const allAiredSeen = aired.length > 0 && aired.every((e) => watched.includes(e));
      const toggle = (e) => { const on = !watched.includes(e); setEpisodes(tvId, n, [e], on); onEpisodesChange(on); };
      const toggleAll = () => {
        if (allAiredSeen) setEpisodes(tvId, n, aired, false);
        else { setEpisodes(tvId, n, aired, true); onEpisodesChange(true); toast(`Temporada ${n} marcada como vista`); }
      };
      const pct = count ? Math.min(1, watched.length / count) : 0;

      return html`<div class="rounded-2xl bg-card overflow-hidden">
        <button class="w-full min-h-[56px] px-4 py-2 flex items-center gap-3 text-left" onClick=${() => setOpen(!open)}>
          <div class="flex-1 min-w-0">
            <div class="font-semibold">${season.name || `Temporada ${n}`}</div>
            <div class="flex items-center gap-2 mt-1">
              <div class="h-1 flex-1 max-w-[140px] rounded-full bg-zinc-800 overflow-hidden"><div class="h-full bg-accent rounded-full" style=${{ width: `${Math.round(pct * 100)}%` }}></div></div>
              <span class="text-xs text-zinc-400">${watched.length}/${count}</span>
            </div>
          </div>
          ${count > 0 && watched.length >= count && html`<${Icon} name="CircleCheck" size=${20} class="text-accent" />`}
          <${Icon} name="ChevronDown" size=${20} class=${'text-zinc-500 transition-transform ' + (open ? 'rotate-180' : '')} />
        </button>
        ${open && html`<div class="border-t border-line/70 screen-enter">
          ${!eps ? html`<div class="p-4 space-y-3">${[0, 1, 2].map((i) => html`<div key=${i} class="skeleton h-9 rounded-lg"></div>`)}</div>`
            : html`<div>
              ${aired.length > 0 && html`<div class="px-3 pt-3">
                <button class=${'press w-full h-11 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 ' + (allAiredSeen ? 'bg-card2 text-zinc-300' : 'bg-accent/15 text-accent')} onClick=${toggleAll}>
                  <${Icon} name="CheckCheck" size=${18} />${allAiredSeen ? 'Desmarcar temporada' : 'Marcar temporada completa'}
                </button>
              </div>`}
              <ul class="py-1">
                ${eps.map((e) => {
                  const on = watched.includes(e.episode_number);
                  const future = e.air_date && e.air_date > today;
                  return html`<li key=${e.episode_number}>
                    <button class=${'w-full min-h-[52px] px-3 flex items-center gap-3 text-left active:bg-white/5 ' + (future ? 'opacity-50' : '')} onClick=${() => toggle(e.episode_number)}>
                      <span class=${'w-7 h-7 rounded-lg border-2 flex items-center justify-center shrink-0 transition-colors ' + (on ? 'bg-accent border-accent text-black' : 'border-zinc-600')}>
                        ${on && html`<${Icon} name="Check" size=${16} strokeWidth=${3} />`}
                      </span>
                      <div class="flex-1 min-w-0">
                        <div class=${'text-sm truncate ' + (on ? 'text-zinc-400' : '')}>${e.episode_number}. ${e.name || `Episodio ${e.episode_number}`}</div>
                        <div class="text-[11px] text-zinc-500">${future ? `Se estrena ${countdown(e.air_date)} · ` : ''}${e.air_date ? fmtDate(e.air_date, { day: 'numeric', month: 'short', year: 'numeric' }) : 'Sin fecha'}${e.runtime ? ` · ${e.runtime} min` : ''}</div>
                      </div>
                    </button>
                  </li>`;
                })}
              </ul>
            </div>`}
        </div>`}
      </div>`;
    }

    // ---------- Avisos ----------
    function NotificationsScreen() {
      const { notifications, titles } = useStore();
      const unread = notifications.some((n) => !n.read);
      const markAll = () => store.set('notifications', (l) => l.map((n) => ({ ...n, read: true })));
      const open = (n) => {
        store.set('notifications', (l) => l.map((x) => (x.id === n.id ? { ...x, read: true } : x)));
        const [type, id] = n.titleId.split('_');
        openTitle(type, id);
      };
      const clear = async () => {
        if (await confirmDialog({ title: '¿Borrar todos los avisos?', message: 'Se eliminará el historial de avisos.', confirmText: 'Borrar', danger: true }))
          store.set('notifications', []);
      };
      return html`<${OverlayPage} title="Avisos"
        right=${notifications.length > 0 && html`<button class="icon-btn text-zinc-400" aria-label="Borrar avisos" onClick=${clear}><${Icon} name="Trash2" size=${20} /></button>`}>
        ${unread && html`<button class="press w-full h-11 mb-3 rounded-xl bg-card text-accent text-sm font-semibold flex items-center justify-center gap-2" onClick=${markAll}>
          <${Icon} name="CheckCheck" size=${18} />Marcar todas como leídas</button>`}
        ${notifications.length === 0
          ? html`<div class="mt-4"><${EmptyState} icon="BellRing" title="No tienes avisos"
              text="Sigue tus series y te avisaremos aquí de nuevos episodios y temporadas." /></div>`
          : html`<div class="space-y-2">${notifications.map((n) => {
              const t = titles[n.titleId];
              return html`<button key=${n.id} class=${'press w-full flex gap-3 p-3 rounded-2xl text-left ' + (n.read ? 'bg-card/60' : 'bg-card border border-accent/30')} onClick=${() => open(n)}>
                ${t ? html`<${Poster} path=${t.poster} title=${t.title} id=${t.id} size="w185" class="w-11 h-16 rounded-lg shrink-0" />`
                  : html`<div class="w-11 h-16 rounded-lg bg-card2 flex items-center justify-center shrink-0"><${Icon} name="Tv" size=${18} class="text-zinc-500" /></div>`}
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wide ${n.kind === 'season' ? 'text-accent' : 'text-sky-300'}">
                    <${Icon} name=${n.kind === 'season' ? 'Sparkles' : 'CalendarDays'} size=${12} />${n.kind === 'season' ? 'Nueva temporada' : 'Nuevo episodio'}
                  </div>
                  <div class=${'text-sm mt-0.5 ' + (n.read ? 'text-zinc-400' : 'text-zinc-100')}>${n.message}</div>
                  <div class="text-[11px] text-zinc-500 mt-1">${timeAgo(new Date(n.date).getTime())}</div>
                </div>
                ${!n.read && html`<span class="w-2.5 h-2.5 rounded-full bg-accent mt-1.5 shrink-0"></span>`}
              </button>`;
            })}</div>`}
      <//>`;
    }

    // ---------- Ajustes ----------
    function Card({ title, icon, children }) {
      return html`<section class="mt-4 rounded-3xl bg-card p-4">
        <div class="flex items-center gap-2 font-semibold mb-3"><${Icon} name=${icon} size=${18} class="text-accent" />${title}</div>
        ${children}
      </section>`;
    }

    function SettingsScreen() {
      const { settings, titles, checking } = useStore();
      const [pinMode, setPinMode] = useState(null); // 'set' | 'change' | 'disable'
      const [editKey, setEditKey] = useState(false);
      const fileRef = useRef(null);
      const followedCount = Object.values(titles).filter((t) => t.type === 'tv' && t.followed).length;
      const keyLabel = settings.apiKey ? (isV4(settings.apiKey) ? 'Token de lectura (v4)' : 'API key (v3)') : 'Sin clave · modo demo';

      // Exporta todo menos la clave y el PIN
      const exportData = () => {
        const data = {
          app: 'MisSeries', version: 1, exportedAt: new Date().toISOString(),
          titles: store.state.titles, watchedEpisodes: store.state.watchedEpisodes, notifications: store.state.notifications
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `misseries-copia-${todayStr()}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        toast('Copia de seguridad descargada');
      };
      const importData = async (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        let data;
        try { data = JSON.parse(await file.text()); } catch (err) { toast('El archivo no es un JSON válido'); return; }
        if (!data || typeof data.titles !== 'object' || Array.isArray(data.titles)) { toast('Este archivo no parece una copia de Mis Series'); return; }
        const n = Object.keys(data.titles).length;
        const ok = await confirmDialog({
          title: '¿Restaurar copia?', confirmText: 'Restaurar',
          message: `Se reemplazarán tus datos actuales por los de la copia (${plural(n, 'título', 'títulos')}${data.exportedAt ? `, del ${fmtDate(data.exportedAt.slice(0, 10))}` : ''}). Tu clave y tu PIN no cambian.`
        });
        if (!ok) return;
        store.set('titles', data.titles || {});
        store.set('watchedEpisodes', data.watchedEpisodes && typeof data.watchedEpisodes === 'object' ? data.watchedEpisodes : {});
        store.set('notifications', Array.isArray(data.notifications) ? data.notifications : []);
        toast('Datos restaurados');
      };
      const removeApiKey = async () => {
        if (await confirmDialog({ title: '¿Quitar la clave?', message: 'La app pasará a modo demo con datos de ejemplo. Tus listas no se borran.', confirmText: 'Quitar' })) {
          store.set('settings', (s) => ({ ...s, apiKey: '', demo: true }));
          memCache.clear();
        }
      };
      const wipeAll = async () => {
        if (await confirmDialog({ title: '¿Borrar todos los datos?', message: 'Se eliminarán listas, episodios, notas, avisos, PIN y clave de este dispositivo. No se puede deshacer.', confirmText: 'Borrar todo', danger: true })) {
          PERSISTED.forEach(removeKey);
          location.hash = '';
          location.reload();
        }
      };

      return html`<${OverlayPage} title="Ajustes">
        <${Card} title="Conexión con TMDB" icon="KeyRound">
          <div class="flex items-center gap-3">
            <div class="flex-1">
              <div class="text-sm">${keyLabel}</div>
              ${settings.apiKey && html`<div class="text-xs text-zinc-500 font-mono mt-0.5">••••••${settings.apiKey.slice(-4)}</div>`}
            </div>
            <button class="h-10 px-4 rounded-xl bg-card2 text-sm font-semibold" onClick=${() => setEditKey(!editKey)}>${editKey ? 'Cancelar' : settings.apiKey ? 'Cambiar' : 'Añadir'}</button>
          </div>
          ${editKey && html`<div class="mt-3"><${ApiKeyForm} onSaved=${() => setEditKey(false)} /></div>`}
          ${settings.apiKey && !editKey && html`<button class="mt-2 h-10 text-sm text-zinc-500" onClick=${removeApiKey}>Quitar clave y usar modo demo</button>`}
        <//>

        <${Card} title="Avisos de estrenos" icon="BellRing">
          <p class="text-sm text-zinc-400">Sigues ${plural(followedCount, 'serie', 'series')}. Al abrir la app comprobamos novedades como máximo cada 6 horas.</p>
          <p class="text-xs text-zinc-500 mt-1">Última comprobación: ${settings.lastCheck ? timeAgo(settings.lastCheck) : 'nunca'}</p>
          <button class="press mt-3 w-full h-11 rounded-xl bg-card2 font-semibold text-sm flex items-center justify-center gap-2 disabled:opacity-50"
            disabled=${checking} onClick=${() => checkFollowedSeries({ force: true }).then(() => toast('Comprobación terminada'))}>
            <${Icon} name="RefreshCw" size=${17} class=${checking ? 'animate-spin' : ''} />${checking ? 'Comprobando…' : 'Comprobar ahora'}
          </button>
        <//>

        <${Card} title="PIN de acceso" icon="Lock">
          ${!cryptoOk
            ? html`<p class="text-sm text-zinc-400">El PIN necesita una conexión segura (https). Abre la app desde GitHub Pages para activarlo.</p>`
            : settings.pinHash
              ? html`<p class="text-sm text-zinc-400">Activado. Se pedirá al abrir la app.</p>
                  <div class="grid grid-cols-2 gap-2 mt-3">
                    <button class="press h-11 rounded-xl bg-card2 text-sm font-semibold" onClick=${() => setPinMode('change')}>Cambiar PIN</button>
                    <button class="press h-11 rounded-xl bg-card2 text-sm font-semibold text-rose-300" onClick=${() => setPinMode('disable')}>Desactivar</button>
                  </div>`
              : html`<p class="text-sm text-zinc-400">Protege la app con un PIN de 4 dígitos. Se guarda cifrado (SHA-256), nunca en texto plano.</p>
                  <button class="press mt-3 w-full h-11 rounded-xl bg-accent text-black text-sm font-semibold" onClick=${() => setPinMode('set')}>Activar PIN</button>`}
        <//>

        <${Card} title="Copia de seguridad" icon="Save">
          <p class="text-sm text-zinc-400">Descarga un archivo JSON con tus listas, episodios, notas y avisos (sin la clave ni el PIN).</p>
          <div class="grid grid-cols-2 gap-2 mt-3">
            <button class="press h-11 rounded-xl bg-card2 text-sm font-semibold flex items-center justify-center gap-2" onClick=${exportData}><${Icon} name="Download" size=${17} />Exportar datos</button>
            <button class="press h-11 rounded-xl bg-card2 text-sm font-semibold flex items-center justify-center gap-2" onClick=${() => fileRef.current && fileRef.current.click()}><${Icon} name="Upload" size=${17} />Importar datos</button>
          </div>
          <input ref=${fileRef} type="file" accept="application/json,.json" class="hidden" onChange=${importData} />
        <//>

        <${Card} title="Zona peligrosa" icon="TriangleAlert">
          <button class="press w-full h-11 rounded-xl bg-rose-500/10 text-rose-300 text-sm font-semibold flex items-center justify-center gap-2" onClick=${wipeAll}>
            <${Icon} name="Trash2" size=${17} />Borrar todos los datos
          </button>
        <//>

        <section class="mt-6 px-2 text-center">
          <div class="inline-flex items-center gap-2 px-3 h-8 rounded-full bg-card text-xs font-bold tracking-wide" style=${{ color: '#01b4e4' }}>TMDB</div>
          <p class="text-xs text-zinc-500 mt-2">Esta app usa la API de TMDB pero no está respaldada ni certificada por TMDB.</p>
          <p class="text-xs text-zinc-600 mt-1">Datos de disponibilidad en plataformas: JustWatch. · Mis Series v1</p>
        </section>

        ${pinMode && html`<${PinModal} mode=${pinMode} onClose=${() => setPinMode(null)} />`}
      <//>`;
    }

    function PinModal({ mode, onClose }) {
      const [step, setStep] = useState(mode === 'set' ? 'new' : 'current');
      const first = useRef('');
      const TITLES = { current: 'Introduce tu PIN actual', new: 'Elige un PIN de 4 dígitos', confirm: 'Repite el nuevo PIN' };
      const onComplete = async (pin) => {
        if (step === 'current') {
          if ((await sha256Pin(pin)) !== store.state.settings.pinHash) return false;
          if (mode === 'disable') { store.set('settings', (s) => ({ ...s, pinHash: '' })); toast('PIN desactivado'); onClose(); return true; }
          setStep('new'); return true;
        }
        if (step === 'new') { first.current = pin; setStep('confirm'); return true; }
        if (pin !== first.current) { toast('Los PIN no coinciden. Vuelve a intentarlo.'); setStep('new'); return false; }
        const hash = await sha256Pin(pin);
        store.set('settings', (s) => ({ ...s, pinHash: hash }));
        toast(mode === 'change' ? 'PIN cambiado' : 'PIN activado');
        onClose();
        return true;
      };
      return html`<div class="fixed inset-0 z-50 bg-base flex flex-col items-center justify-center pt-safe pb-safe pop-in">
        <button class="icon-btn absolute right-3 top-safe text-zinc-400" aria-label="Cerrar" onClick=${onClose}><${Icon} name="X" size=${24} /></button>
        <${PinPad} key=${step} title=${TITLES[step]} subtitle=${mode === 'disable' ? 'Para desactivar el PIN' : ''} onComplete=${onComplete} />
      </div>`;
    }

    /* =====================================================================
       APP (raíz: bloqueo, bienvenida, pestañas y pantallas superpuestas)
       ===================================================================== */
    const TAB_SCREENS = { inicio: HomeScreen, buscar: SearchScreen, lista: ListScreen, descubrir: DiscoverScreen };

    function App() {
      const st = useStore();
      const route = useRoute();
      const [locked, setLocked] = useState(!!st.settings.pinHash);
      const ready = !locked && !!(st.settings.apiKey || st.settings.demo);

      // Pide el PIN de nuevo si la app vuelve tras más de 1 minuto en segundo plano
      useEffect(() => {
        let hiddenAt = 0;
        const on = () => {
          if (document.hidden) { hiddenAt = Date.now(); return; }
          if (hiddenAt && Date.now() - hiddenAt > 60e3 && store.state.settings.pinHash) setLocked(true);
          else checkFollowedSeries(); // respeta el límite de 6 horas
        };
        document.addEventListener('visibilitychange', on);
        return () => document.removeEventListener('visibilitychange', on);
      }, []);

      // Comprobación de estrenos al abrir
      useEffect(() => {
        if (!ready) return;
        const t = setTimeout(() => checkFollowedSeries(), 1500);
        return () => clearTimeout(t);
      }, [ready]);

      // Pestaña activa (se recuerda mientras hay una pantalla encima)
      const isTab = !!TAB_SCREENS[route.name];
      const lastTab = useRef('inicio');
      if (isTab) lastTab.current = route.name;
      const active = lastTab.current;
      const visited = useRef({});
      visited.current[active] = true;

      // Guardar y restaurar el scroll de cada pestaña
      const scrolls = useRef({});
      const onTab = (id) => {
        if (id === active && isTab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
        scrolls.current[active] = window.scrollY;
        navigate('/' + id, { replace: true });
      };
      useLayoutEffect(() => { window.scrollTo(0, scrolls.current[active] || 0); }, [active]);

      if (locked) return html`<${LockScreen} onUnlock=${() => setLocked(false)} /><${DialogHost} /><${ToastHost} />`;
      if (!st.settings.apiKey && !st.settings.demo) return html`<${WelcomeScreen} /><${DialogHost} /><${ToastHost} />`;

      let overlay = null;
      if (route.name === 'serie' || route.name === 'pelicula') {
        const type = route.name === 'serie' ? 'tv' : 'movie';
        const id = route.params[0];
        if (id && /^\d+$/.test(id)) overlay = html`<${DetailScreen} key=${type + id} type=${type} id=${id} />`;
      } else if (route.name === 'ajustes') overlay = html`<${SettingsScreen} />`;
      else if (route.name === 'avisos') overlay = html`<${NotificationsScreen} />`;

      return html`
        <main class="main-pad px-safe">
          ${TABS.map((t) => {
            if (!visited.current[t.id]) return null;
            const Screen = TAB_SCREENS[t.id];
            // Las pestañas no se desmontan: conservan búsqueda y scroll
            return html`<div key=${t.id} class="screen-enter" style=${{ display: t.id === active ? 'block' : 'none' }}><${Screen} /></div>`;
          })}
        </main>
        <${BottomNav} active=${active} onTab=${onTab} />
        ${overlay}
        <${DialogHost} />
        <${ToastHost} />`;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
